  <rect x="140" y="1140" width="800" height="100" rx="12" fill="white" stroke="#E8E8E8" stroke-width="1"/>
  <text x="180" y="1200" font-family="SF Pro" font-size="30" font-weight="800" fill="#2B4C7E">1</text>
  <text x="230" y="1188" font-family="Apple SD Gothic Neo" font-size="28" font-weight="600" fill="#222">래미안 퍼스티지</text>
  <text x="230" y="1222" font-family="Apple SD Gothic Neo" font-size="22" fill="#666">84㎡ 기준</text>
  <text x="900" y="1200" font-family="Apple SD Gothic Neo" font-size="28" font-weight="700" fill="#2B4C7E" text-anchor="end">24.5억</text>

  <rect x="140" y="1260" width="800" height="100" rx="12" fill="white" stroke="#E8E8E8" stroke-width="1"/>
  <text x="180" y="1320" font-family="SF Pro" font-size="30" font-weight="800" fill="#2B4C7E">2</text>
  <text x="230" y="1308" font-family="Apple SD Gothic Neo" font-size="28" font-weight="600" fill="#222">반포자이</text>
  <text x="230" y="1342" font-family="Apple SD Gothic Neo" font-size="22" fill="#666">84㎡ 기준</text>
  <text x="900" y="1320" font-family="Apple SD Gothic Neo" font-size="28" font-weight="700" fill="#2B4C7E" text-anchor="end">22.8억</text>

  <rect x="140" y="1380" width="800" height="100" rx="12" fill="white" stroke="#E8E8E8" stroke-width="1"/>
  <text x="180" y="1440" font-family="SF Pro" font-size="30" font-weight="800" fill="#2B4C7E">3</text>
  <text x="230" y="1428" font-family="Apple SD Gothic Neo" font-size="28" font-weight="600" fill="#222">아크로리버파크</text>
  <text x="230" y="1462" font-family="Apple SD Gothic Neo" font-size="22" fill="#666">84㎡ 기준</text>
  <text x="900" y="1440" font-family="Apple SD Gothic Neo" font-size="28" font-weight="700" fill="#2B4C7E" text-anchor="end">21.3억</text>

  <rect x="140" y="1500" width="800" height="100" rx="12" fill="white" stroke="#E8E8E8" stroke-width="1"/>
  <text x="180" y="1560" font-family="SF Pro" font-size="30" font-weight="800" fill="#4A6FA1">4</text>
  <text x="230" y="1548" font-family="Apple SD Gothic Neo" font-size="28" font-weight="600" fill="#222">삼성 래미안</text>
  <text x="230" y="1582" font-family="Apple SD Gothic Neo" font-size="22" fill="#666">59㎡ 기준</text>
  <text x="900" y="1560" font-family="Apple SD Gothic Neo" font-size="28" font-weight="700" fill="#2B4C7E" text-anchor="end">18.2억</text>

  <!-- Bottom nav -->
  <rect x="102" y="1688" width="876" height="140" fill="white"/>
  <line x1="102" y1="1688" x2="978" y2="1688" stroke="#E8E8E8" stroke-width="1"/>
  <circle cx="246" cy="1728" r="16" fill="none" stroke="#999" stroke-width="2.5"/>
  <text x="246" y="1776" font-family="Apple SD Gothic Neo" font-size="22" fill="#999" text-anchor="middle">홈</text>
  <circle cx="432" cy="1728" r="16" fill="#2B4C7E"/>
  <text x="432" y="1776" font-family="Apple SD Gothic Neo" font-size="22" font-weight="600" fill="#2B4C7E" text-anchor="middle">시세</text>
  <circle cx="618" cy="1728" r="16" fill="none" stroke="#999" stroke-width="2.5"/>
  <text x="618" y="1776" font-family="Apple SD Gothic Neo" font-size="22" fill="#999" text-anchor="middle">청약</text>
  <circle cx="804" cy="1728" r="16" fill="none" stroke="#999" stroke-width="2.5"/>
  <text x="804" y="1776" font-family="Apple SD Gothic Neo" font-size="22" fill="#999" text-anchor="middle">설정</text>
</svg>

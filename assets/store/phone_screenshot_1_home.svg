<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <!-- Background -->
  <rect width="1080" height="1920" fill="#F9FAFB"/>

  <!-- Status Bar -->
  <rect width="1080" height="88" fill="#FFFFFF"/>

  <line x1="0" y1="1770" x2="1080" y2="1770" stroke="#F2F4F6" stroke-width="2"/>
  <!-- Home (active) -->
  <text x="108" y="1820" font-family="Arial" font-size="36" text-anchor="middle" fill="#3182F6">🏠</text>
  <text x="108" y="1858" font-family="Arial" font-size="20" text-anchor="middle" fill="#3182F6" font-weight="bold">홈</text>
  <!-- 시세 -->

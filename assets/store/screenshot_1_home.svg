  <text x="290" y="1120" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24" fill="#666">33㎡ · 12층 · 2025.02</text>
  <text x="900" y="1090" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#2B4C7E" text-anchor="end">5.8억</text>


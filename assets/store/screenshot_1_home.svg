  <text x="540" y="230" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="52" font-weight="800" fill="#2B4C7E" text-anchor="middle">한눈에 확인하세요</text>

  <!-- Phone frame -->
  <rect x="90" y="320" width="900" height="1520" rx="48" ry="48" fill="#1a1a1a"/>
  <rect x="102" y="332" width="876" height="1496" rx="40" ry="40" fill="white"/>

  <!-- Status bar -->

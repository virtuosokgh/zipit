  <text x="330" y="1350" font-family="Apple SD Gothic Neo" font-size="26" fill="#2B4C7E" text-anchor="middle">반포자이</text>
  <text x="170" y="1440" font-family="Apple SD Gothic Neo" font-size="24" font-weight="600" fill="#222">반포자이</text>

  <rect x="560" y="1270" width="380" height="200" rx="16" fill="white" stroke="#E8E8E8" stroke-width="1.5"/>
  <rect x="580" y="1290" width="340" height="100" rx="12" fill="#EBF3FE"/>
  <text x="750" y="1350" font-family="Apple SD Gothic Neo" font-size="26" fill="#2B4C7E" text-anchor="middle">아크로리버파크</text>
  <text x="590" y="1440" font-family="Apple SD Gothic Neo" font-size="24" font-weight="600" fill="#222">아크로리버파크</text>

  <!-- Bottom nav -->
  <rect x="102" y="1688" width="876" height="140" rx="0" fill="white"/>
  <line x1="102" y1="1688" x2="978" y2="1688" stroke="#E8E8E8" stroke-width="1"/>


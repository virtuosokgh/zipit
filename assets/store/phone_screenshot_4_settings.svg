<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#F9FAFB"/>

  <!-- Status Bar -->
  <rect width="1080" height="88" fill="#FFFFFF"/>
  <text x="50" y="60" font-family="Arial" font-size="28" fill="#191F28">9:41</text>
  <text x="930" y="60" font-family="Arial" font-size="24" fill="#191F28">100%</text>

  <!-- AppBar -->
  <rect y="88" width="1080" height="112" fill="#FFFFFF"/>

  <!-- Bottom Nav Bar -->
  <rect y="1770" width="1080" height="150" fill="#FFFFFF"/>
  <line x1="0" y1="1770" x2="1080" y2="1770" stroke="#F2F4F6" stroke-width="2"/>
  <text x="108" y="1820" font-family="Arial" font-size="36" text-anchor="middle" fill="#8B95A1">🏠</text>
  <text x="108" y="1858" font-family="Arial" font-size="20" text-anchor="middle" fill="#8B95A1">홈</text>
  <text x="324" y="1820" font-family="Arial" font-size="36" text-anchor="middle" fill="#8B95A1">📊</text>
  <text x="324" y="1858" font-family="Arial" font-size="20" text-anchor="middle" fill="#8B95A1">시세</text>
  <text x="540" y="1820" font-family="Arial" font-size="36" text-anchor="middle" fill="#8B95A1">📄</text>
  <text x="540" y="1858" font-family="Arial" font-size="20" text-anchor="middle" fill="#8B95A1">내 계약</text>
  <text x="756" y="1820" font-family="Arial" font-size="36" text-anchor="middle" fill="#8B95A1">🏢</text>
  <text x="756" y="1858" font-family="Arial" font-size="20" text-anchor="middle" fill="#8B95A1">청약</text>
  <text x="972" y="1820" font-family="Arial" font-size="36" text-anchor="middle" fill="#3182F6">⚙️</text>
  <text x="972" y="1858" font-family="Arial" font-size="20" text-anchor="middle" fill="#3182F6" font-weight="bold">설정</text>
</svg>

  <text x="980" y="160" font-family="Arial" font-size="36" fill="#8B95A1">🔔</text>

  <g transform="translate(0, 220)">
    <!-- Section: 잠금화면 위젯 -->
    <text x="60" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#8B95A1">잠금화면 위젯</text>

    <!-- Toggle item -->
    <rect x="0" y="60" width="1080" height="80" fill="#FFFFFF"/>
    <text x="60" y="108" font-family="Arial" font-size="28" fill="#191F28">잠금화면에 정보 표시</text>
    <text x="60" y="136" font-family="Arial" font-size="22" fill="#8B95A1">관심 지역 시세, 청약 D-day 등</text>
    <!-- Toggle ON -->
    <rect x="920" y="90" width="60" height="32" rx="16" fill="#3182F6"/>
    <circle cx="958" cy="106" r="13" fill="#FFFFFF"/>

    <rect x="0" y="160" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="203" font-family="Arial" font-size="28" fill="#191F28">위젯 종류 및 조건 설정</text>
    <text x="980" y="203" font-family="Arial" font-size="26" fill="#D1D6DB">›</text>

    <rect x="0" y="240" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="283" font-family="Arial" font-size="28" fill="#191F28">위젯 표시 항목 설정</text>
    <text x="980" y="283" font-family="Arial" font-size="26" fill="#D1D6DB">›</text>

    <rect x="0" y="320" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="363" font-family="Arial" font-size="28" fill="#191F28">위젯 스타일 변경</text>
    <text x="980" y="363" font-family="Arial" font-size="26" fill="#D1D6DB">›</text>

    <!-- Divider -->
    <line x1="40" y1="420" x2="1040" y2="420" stroke="#F2F4F6" stroke-width="2"/>

    <!-- Section: 관심 설정 -->
    <text x="60" y="470" font-family="Arial" font-size="24" font-weight="bold" fill="#8B95A1">관심 설정</text>

    <rect x="0" y="490" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="533" font-family="Arial" font-size="28" fill="#191F28">관심 유형</text>
    <text x="800" y="533" font-family="Arial" font-size="26" fill="#8B95A1">매매, 청약</text>

    <rect x="0" y="570" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="613" font-family="Arial" font-size="28" fill="#191F28">관심 지역</text>
    <text x="730" y="613" font-family="Arial" font-size="26" fill="#8B95A1">서울 강남구 외 2</text>

    <rect x="0" y="650" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="693" font-family="Arial" font-size="28" fill="#191F28">예산 범위</text>
    <text x="770" y="693" font-family="Arial" font-size="26" fill="#8B95A1">5억 ~ 15억</text>

    <rect x="0" y="730" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="773" font-family="Arial" font-size="28" fill="#3182F6">관심 설정 수정하기</text>
    <text x="980" y="773" font-family="Arial" font-size="26" fill="#D1D6DB">›</text>

    <!-- Divider -->
    <line x1="40" y1="830" x2="1040" y2="830" stroke="#F2F4F6" stroke-width="2"/>

    <!-- Section: 알림 -->
    <text x="60" y="880" font-family="Arial" font-size="24" font-weight="bold" fill="#8B95A1">알림</text>

    <rect x="0" y="900" width="1080" height="80" fill="#FFFFFF"/>
    <text x="60" y="948" font-family="Arial" font-size="28" fill="#191F28">푸시 알림</text>
    <text x="60" y="976" font-family="Arial" font-size="22" fill="#8B95A1">계약 일정, 청약 마감 등</text>
    <rect x="920" y="930" width="60" height="32" rx="16" fill="#3182F6"/>
    <circle cx="958" cy="946" r="13" fill="#FFFFFF"/>

    <!-- Divider -->
    <line x1="40" y1="1010" x2="1040" y2="1010" stroke="#F2F4F6" stroke-width="2"/>

    <!-- Section: 계정 -->
    <text x="60" y="1060" font-family="Arial" font-size="24" font-weight="bold" fill="#8B95A1">계정</text>

    <rect x="0" y="1080" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="1123" font-family="Arial" font-size="28" fill="#191F28">로그아웃</text>

    <rect x="0" y="1160" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="1203" font-family="Arial" font-size="28" fill="#191F28">서비스 이용약관</text>
    <text x="980" y="1203" font-family="Arial" font-size="26" fill="#D1D6DB">›</text>

    <rect x="0" y="1240" width="1080" height="70" fill="#FFFFFF"/>
    <text x="60" y="1283" font-family="Arial" font-size="28" fill="#191F28">개인정보 처리방침</text>
    <text x="980" y="1283" font-family="Arial" font-size="26" fill="#D1D6DB">›</text>

    <!-- Version -->
    <text x="540" y="1380" font-family="Arial" font-size="24" fill="#8B95A1" text-anchor="middle">집잇 v1.0.0</text>

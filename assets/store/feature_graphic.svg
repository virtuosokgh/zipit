<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF3FE"/>
      <stop offset="100%" stop-color="#D6E6FD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- House icon on LEFT side, scaled down -->
  <g transform="translate(200, 250) scale(0.45)">
    <!-- Roof -->
    <path d="M-260,-130 L0,-310 L260,-130" fill="none" stroke="#2B4C7E" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Chimney -->
    <rect x="125" y="-280" width="52" height="100" rx="8" fill="#2B4C7E"/>
    <!-- House walls -->
    <rect x="-220" y="-130" width="440" height="330" rx="24" fill="white" stroke="#2B4C7E" stroke-width="32"/>
    <!-- Eyes -->
    <circle cx="-82" cy="15" r="22" fill="#2B4C7E"/>
    <circle cx="82" cy="15" r="22" fill="#2B4C7E"/>
    <circle cx="-75" cy="6" r="7.5" fill="white"/>
    <circle cx="89" cy="6" r="7.5" fill="white"/>
    <!-- Smile -->
    <path d="M-50,75 Q0,120 50,75" fill="none" stroke="#2B4C7E" stroke-width="13" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="-128" cy="55" rx="30" ry="18" fill="#FF9999" opacity="0.4"/>
    <ellipse cx="128" cy="55" rx="30" ry="18" fill="#FF9999" opacity="0.4"/>
  </g>

  <!-- Text on RIGHT side with clear spacing -->
  <text x="620" y="210" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="100" font-weight="800" fill="#2B4C7E" text-anchor="middle">집잇</text>
  <text x="620" y="290" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="500" fill="#4A6FA1" text-anchor="middle">내 관심 지역의 부동산 정보를 한눈에</text>
</svg>

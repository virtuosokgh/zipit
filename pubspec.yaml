name: zipit
description: "집잇 - 부동산 계약의 모든 것"
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Network
  dio: ^5.8.0+1
  retrofit: ^4.6.0

  # Local Storage
  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^1.0.0
  smooth_page_indicator: ^1.2.0+3

  # Widget (Lock Screen)
  home_widget: ^0.7.0

  # Map
  flutter_naver_map: ^1.3.1

  # XML parsing
  xml: ^6.5.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  permission_handler: ^11.4.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  freezed: ^3.0.6
  riverpod_generator: ^2.6.5
  retrofit_generator: ^9.3.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#3182F6"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
